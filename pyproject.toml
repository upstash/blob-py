[project]
name = "upstash-blob"
version = "0.2.0"
description = "Python SDK for Upstash Blob"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Upstash", email = "support@upstash.com" }]
maintainers = [{ name = "Upstash", email = "support@upstash.com" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.23.0,<1"]
keywords = ["Upstash", "Upstash Blob", "blob", "storage", "s3", "r2", "upload"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://upstash.com/docs/blob"
Repository = "https://github.com/upstash/blob-py"
Issues = "https://github.com/upstash/blob-py/issues"

[dependency-groups]
dev = [
    "boto3>=1.35",
    "django>=4.2",
    "fastapi>=0.110",
    "flask>=3.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/upstash_blob", "/README.md", "/LICENSE"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]
per-file-ignores = { "tests/**" = ["E501"] }

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: runs against real buckets; needs UPSTASH_BLOB_PUBLIC_TOKEN and UPSTASH_BLOB_PRIVATE_TOKEN"]
